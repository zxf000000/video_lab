<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="film" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Film strip holes - top -->
  <rect x="64" y="72" width="40" height="48" rx="8" fill="#4f46e5" opacity="0.5"/>
  <rect x="128" y="72" width="40" height="48" rx="8" fill="#4f46e5" opacity="0.5"/>
  <rect x="192" y="72" width="40" height="48" rx="8" fill="#4f46e5" opacity="0.5"/>
  <!-- Film strip holes - bottom -->
  <rect x="64" y="392" width="40" height="48" rx="8" fill="#4f46e5" opacity="0.5"/>
  <rect x="128" y="392" width="40" height="48" rx="8" fill="#4f46e5" opacity="0.5"/>
  <rect x="192" y="392" width="40" height="48" rx="8" fill="#4f46e5" opacity="0.5"/>
  <!-- Play triangle -->
  <path d="M220 176 L220 336 L360 256 Z" fill="white" opacity="0.95"/>
  <!-- Sparkle / AI indicator -->
  <circle cx="400" cy="120" r="16" fill="#fbbf24"/>
  <circle cx="400" cy="120" r="8" fill="white" opacity="0.6"/>
  <!-- Small film frame icon -->
  <rect x="64" y="144" width="128" height="224" rx="12" stroke="url(#film)" stroke-width="6" fill="none" opacity="0.4"/>
</svg>